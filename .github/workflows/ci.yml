name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify protected Worker build and CSP
        run: node scripts/check-build.mjs
      - name: No unsafe DOM APIs or external URLs in the interactive room
        run: |
          # The case-study presentation uses trusted static HTML templates and
          # documentation links. Agent evidence lives in the room modules below.
          if grep -rn "innerHTML\|insertAdjacentHTML\|outerHTML" src/ui src/engine src/webmcp src/main.ts; then echo "forbidden DOM API"; exit 1; fi
          if grep -rn "style=[\"']" src/ index.html; then echo "inline style attribute"; exit 1; fi
          if grep -rn "setAttribute(['\"]style" src/; then echo "style via setAttribute"; exit 1; fi
          if grep -rn "https\?://" src/ui src/engine src/webmcp src/main.ts index.html; then echo "external URL"; exit 1; fi
      - name: Scan full Git history for secrets with Gitleaks CLI
        shell: bash
        run: |
          # The open-source CLI does not require the Action's organization license.
          gitleaks_dir="$(mktemp -d)"
          trap 'rm -rf "$gitleaks_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$gitleaks_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $gitleaks_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$gitleaks_dir/gitleaks.tar.gz" -C "$gitleaks_dir" gitleaks
          "$gitleaks_dir/gitleaks" git --redact --log-opts="--all" .
